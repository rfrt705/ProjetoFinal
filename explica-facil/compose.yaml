services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: explica_facil
      MYSQL_USER: explica
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Executa primeiro python iniciar.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Executa primeiro python iniciar.py}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u explica -D explica_facil -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: explica_facil
      MYSQL_USER: explica
    ports:
      - "127.0.0.1:${HOST_PORT:-8008}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/entrar/', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    restart: unless-stopped
volumes:
  mysql_data:
